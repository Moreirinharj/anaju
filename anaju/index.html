<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Flor & Sol Pixelado</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  #wrap {
    position: relative;
    box-shadow: 0 0 60px rgba(180, 100, 255, 0.25);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #000;
    image-rendering: pixelated;
  }
  #ui {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.55);
    padding: 10px 16px;
    border-radius: 30px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  button {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.2s;
  }
  button:hover { background: rgba(255,255,255,0.18); }
  #time {
    font-size: 12px;
    color: #ccc;
    align-self: center;
    min-width: 60px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="ui">
    <button id="play">⏸ pausa</button>
    <button id="restart">↻ reiniciar</button>
    <span id="time">0.0s</span>
  </div>
</div>

<script>
// ============ CONFIG ============
const SEED = 5;
const TIME_SCALE = 1.0;
const WIN_FRAC = 0.92;

const KEYS = [
  [0.0,  0.00, 0.00, 0.00, 0.0, 0.00, 0.00],
  [5.0,  0.42, 0.22, 0.00, 0.0, 0.25, 0.00],
  [10.0, 0.62, 0.42, 0.00, 0.0, 0.50, 0.35],
  [16.0, 0.80, 0.68, 0.50, 0.0, 0.72, 0.55],
  [24.0, 1.00, 1.00, 1.00, 0.0, 1.00, 1.00],
  [30.0, 1.00, 1.00, 1.00, 0.0, 1.00, 1.00],
  // Flor encolhe, sol sobe (mesma duração que o crescimento da flor: ~30s)
  [39.0, 0.55, 0.85, 0.55, 1.0, 0.92, 0.00],
  [48.0, 0.25, 0.60, 0.40, 1.0, 0.90, 0.00],
];
const T_END = KEYS[KEYS.length - 1][0];

// ============ PALETAS ============
const SOIL_PAL = [[34,25,20],[50,36,28],[68,50,37],[88,65,47],[108,82,60],[64,58,52]];
const STEM_PAL = [[62,38,120],[100,58,165],[140,84,200],[60,160,140]];
const STEM_WILT = [[120,88,66],[96,66,52],[140,108,76]];
const LEAF_PAL = [[60,150,140],[80,120,175],[130,80,195],[175,105,215]];
const LEAF_WILT = [[130,100,70],[104,76,58],[146,116,84]];
const RIB_PAL = [[210,180,255],[170,230,220]];
const WILT_PAL = [[150,86,128],[116,64,108],[88,52,88],[126,94,104],[104,72,56]];
const RIM_PAL = [[205,165,255],[255,190,250],[170,140,255]];
const HI_PAL = [[235,215,255],[255,225,250]];
const GOLD_PAL = [[255,214,110],[255,238,170],[255,184,90]];
const STAMEN_PAL = [[255,240,255],[255,215,235],[255,230,150],[255,190,80]];
const STAMEN_WILT = [[140,112,84],[120,96,72]];

// Paletas do SOL (mesma estrutura da flor: camadas concêntricas)
const SUN_CORE_PAL = [[255,250,230],[255,245,200],[255,235,170],[255,220,140]];
const SUN_MID_PAL  = [[255,215,110],[255,200,90],[255,185,70],[255,170,60]];
const SUN_EDGE_PAL = [[255,160,50],[245,130,40],[230,100,35],[210,80,30]];
const SUN_RAY_PAL  = [[255,230,150],[255,200,100],[255,170,70],[240,140,50]];
const SUN_HI_PAL   = [[255,255,240],[255,250,220],[255,245,200]];

const LAYERS = [
  {n:8,ac:0.60,ao:1.00,kc:-1.20,ko:0.45,L:1.00,wc:0.20,wo:0.34,d:1150,off:0.00,
   pal:[[210,80,225],[170,58,225],[128,50,218],[96,44,205],[78,42,185]]},
  {n:6,ac:0.48,ao:0.68,kc:-1.05,ko:0.15,L:0.88,wc:0.19,wo:0.31,d:950,off:0.40,
   pal:[[255,150,235],[245,92,218],[205,62,218],[150,52,222]]},
  {n:5,ac:0.36,ao:0.46,kc:-0.85,ko:-0.05,L:0.72,wc:0.17,wo:0.27,d:760,off:0.20,
   pal:[[255,205,245],[255,135,232],[238,84,216],[195,62,226]]},
  {n:4,ac:0.22,ao:0.32,kc:-0.50,ko:-0.10,L:0.46,wc:0.14,wo:0.22,d:480,off:0.55,
   pal:[[255,238,252],[255,185,242],[255,125,228]]},
];

const LEAF_DEFS = [
  [0.10, +1, 1.00, 0.55, -0.80],
  [0.16, -1, 0.90, 0.50, -0.85],
  [0.40, +1, 0.70, 0.95, -0.70],
  [0.33, -1, 0.62, 0.90, -0.65],
];

// ============ UTILS ============
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rngNormal(rng) {
  const u1 = rng(), u2 = rng();
  return Math.sqrt(-2 * Math.log(u1 + 1e-12)) * Math.cos(2 * Math.PI * u2);
}
function rngChoice(rng, arr, probs) {
  const r = rng();
  let acc = 0;
  for (let i = 0; i < probs.length; i++) {
    acc += probs[i];
    if (r < acc) return arr[i];
  }
  return arr[arr.length - 1];
}
function smoothstep(x, a, b) {
  let t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function sinc(x) {
  if (Math.abs(x) < 1e-8) return 1;
  const px = x / Math.PI;
  return Math.sin(Math.PI * px) / (Math.PI * px);
}
function profile(u) {
  u = Math.max(0, Math.min(1, u));
  return Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.85);
}
function palettePick(rng, pal, g, spread = 0.55, jitter = 0.07) {
  const x = Math.max(0, Math.min(1, g)) * (pal.length - 1) + rngNormal(rng) * spread;
  const idx = Math.max(0, Math.min(pal.length - 1, Math.round(x)));
  const c = pal[idx];
  const j = 1 + rngNormal(rng) * jitter;
  return [c[0] * j, c[1] * j, c[2] * j];
}
function areaU(rng, n) {
  const out = [];
  while (out.length < n) {
    const u = rng();
    if (rng() < profile(u)) out.push(u);
  }
  return out;
}
function sampleV(rng, n, rim = 0.14) {
  const v = [];
  for (let i = 0; i < n; i++) {
    let val = rng() * 2 - 1;
    if (rng() < rim) val = Math.sign(val) * (0.88 + rng() * 0.12);
    v.push(val);
  }
  return v;
}
function mixcol(live, wilt, w) {
  return [
    live[0] + (wilt[0] - live[0]) * w,
    live[1] + (wilt[1] - live[1]) * w,
    live[2] + (wilt[2] - live[2]) * w,
  ];
}
function bez(P, s) {
  const q = 1 - s;
  const x = q*q*q*P[0][0] + 3*q*q*s*P[1][0] + 3*q*s*s*P[2][0] + s*s*s*P[3][0];
  const y = q*q*q*P[0][1] + 3*q*q*s*P[1][1] + 3*q*s*s*P[2][1] + s*s*s*P[3][1];
  const dx = 3*q*q*(P[1][0]-P[0][0]) + 6*q*s*(P[2][0]-P[1][0]) + 3*s*s*(P[3][0]-P[2][0]);
  const dy = 3*q*q*(P[1][1]-P[0][1]) + 6*q*s*(P[2][1]-P[1][1]) + 3*s*s*(P[3][1]-P[2][1]);
  return [x, y, dx, dy];
}
function state(t) {
  t = Math.max(0, Math.min(T_END, t));
  const ts = KEYS.map(k => k[0]);
  let i = 0;
  for (let k = 0; k < ts.length - 1; k++) if (t >= ts[k]) i = k;
  i = Math.min(i, ts.length - 2);
  const u = (t - ts[i]) / (ts[i+1] - ts[i]);
  const p0 = KEYS[Math.max(i-1,0)].slice(1);
  const p1 = KEYS[i].slice(1);
  const p2 = KEYS[i+1].slice(1);
  const p3 = KEYS[Math.min(i+2,KEYS.length-1)].slice(1);
  const v = [];
  for (let k = 0; k < p1.length; k++) {
    const val = 0.5 * (2*p1[k] + (p2[k]-p0[k])*u + (2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*u*u
                       + (3*p1[k]-p0[k]-3*p2[k]+p3[k])*u*u*u);
    v.push(Math.max(0, Math.min(1, val)));
  }
  return v;
}

// ============ CANVAS ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  const sh = window.innerHeight, sw = window.innerWidth;
  const size = Math.floor(Math.min(sh * WIN_FRAC, sw * 0.96));
  W = H = size;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
resize();

// ============ PLANTA ============
class Plant {
  constructor(W, H) {
    this.W = W; this.H = H;
    this.rng = mulberry32(SEED);
    this.cx = W / 2;
    this.y0 = H * 0.80;
    this.Ls = H * 0.38;
    this.Lf = H * 0.235;
    this.buildSoil();
    this.buildStem();
    this.buildHead();
    this.buildStamens();
    this.buildLeaves();
    this.buildFx();
    this.buildSun();
    this.buildStars();
  }

  surface(x) {
    const H = this.H, cx = this.cx, W = this.W;
    const dx = (x - cx) / (0.2 * W);
    return (this.y0 - 0.022 * H * Math.exp(-dx*dx)
            - 0.003 * H * Math.sin(x * 0.045)
            - 0.002 * H * Math.sin(x * 0.13 + 1.3));
  }

  buildSoil() {
    const {W, H, rng} = this;
    const n = 18000;
    this.soil = [];
    for (let i = 0; i < n; i++) {
      const x = rng() * W;
      const d = Math.pow(rng(), 1.5) * 0.14 * H;
      const y = this.surface(x) + d;
      const depth = d / (0.14 * H);
      const edge = Math.pow(Math.max(0, Math.min(1, Math.min(x, W-x)/(0.2*W))), 0.8);
      const clump = 0.5 + 0.5 * Math.sin(x*0.07+y*0.05) * Math.sin(y*0.11-x*0.03);
      const bright = Math.pow(1-depth, 0.8) * edge * (0.55 + 0.35*clump + 0.35*rng());
      const col = palettePick(rng, SOIL_PAL, rng(), 1.0).map(c => c * bright);
      const rad = rngChoice(rng, [1.0, 1.5, 2.0], [0.4, 0.4, 0.2]);
      this.soil.push({x, y, col, rad});
    }
    const k = 120;
    for (let i = 0; i < k; i++) {
      const px = 0.05*W + rng() * 0.9 * W;
      const py = this.surface(px) + Math.pow(rng(), 1.3) * 0.1 * H;
      const pc = palettePick(rng, [[58,52,48],[84,74,64],[104,90,76],[46,38,32]], rng(), 0.7);
      const edge = Math.pow(Math.max(0, Math.min(1, Math.min(px, W-px)/(0.2*W))), 0.8);
      pc[0] *= edge; pc[1] *= edge; pc[2] *= edge;
      const rad = rngChoice(rng, [2.0, 3.0], [0.6, 0.4]);
      this.soil.push({x: px, y: py, col: pc, rad});
    }
    this.soilCanvas = document.createElement('canvas');
    this.soilCanvas.width = W; this.soilCanvas.height = H;
    const sctx = this.soilCanvas.getContext('2d');
    for (const p of this.soil) {
      const [r, g, b] = p.col;
      sctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
      sctx.fillRect(p.x|0, p.y|0, Math.ceil(p.rad), Math.ceil(p.rad));
    }
    const m = 300;
    this.cr = {x:[], y:[], amp:[], delay:[], col:[], rad:[]};
    for (let i = 0; i < m; i++) {
      const cx = this.cx + rngNormal(rng) * 0.03 * H;
      this.cr.x.push(cx);
      this.cr.y.push(this.surface(cx) - rng() * 0.006 * H);
      this.cr.amp.push(H * 0.05 * Math.pow(rng(), 2.2));
      this.cr.delay.push(rng() * 2.5);
      this.cr.col.push(palettePick(rng, SOIL_PAL, 0.3 + rng()*0.7, 0.8).map(c => c*0.8));
      this.cr.rad.push(rngChoice(rng, [1.0, 1.5, 2.0], [0.4, 0.4, 0.2]));
    }
  }

  buildStem() {
    const {rng} = this;
    const n = 2400;
    this.stem = {s:[], lat:[], live:[], wilt:[], rn:[], rad:[]};
    for (let i = 0; i < n; i++) {
      const s = rng();
      let lat = rng() * 2 - 1;
      if (rng() < 0.18) lat = Math.sign(lat) * (0.85 + rng()*0.15);
      let live;
      if (rng() < 0.12) {
        live = STEM_PAL[3].map(c => c * (1 + rngNormal(rng)*0.08));
      } else {
        live = palettePick(rng, STEM_PAL.slice(0,3), s*0.8 + rng()*0.2);
      }
      const wilt = palettePick(rng, STEM_WILT, rng(), 0.8);
      const rn = rng();
      const rad = rngChoice(rng, [1.0, 1.5, 2.0], [0.35, 0.45, 0.2]);
      this.stem.s.push(s);
      this.stem.lat.push(lat);
      this.stem.live.push(live);
      this.stem.wilt.push(wilt);
      this.stem.rn.push(rn);
      this.stem.rad.push(rad);
    }
  }

  buildHead() {
    const {rng} = this;
    const h = {th:[], u:[], v:[], ac:[], ao:[], kc:[], ko:[], L:[], wc:[], wo:[],
               live:[], wilt:[], rn:[], rad:[], sp:[], aj:[], pj:[], wj:[]};
    for (const Ly of LAYERS) {
      for (let i = 0; i < Ly.n; i++) {
        const th = 2 * Math.PI * i / Ly.n + Ly.off + rngNormal(rng) * 0.10;
        const aj = rngNormal(rng) * 0.06;
        const lj = 0.92 + rng() * 0.16;
        const pj = rng();
        const wj = -0.5 + rng();
        const d = Ly.d;
        const u = areaU(rng, d);
        const v = sampleV(rng, d);
        for (let k = 0; k < d; k++) {
          let col = palettePick(rng, Ly.pal, u[k] + rngNormal(rng)*0.10);
          if (Math.abs(v[k]) > 0.86 && rng() < 0.55) col = palettePick(rng, RIM_PAL, rng());
          if (rng() < 0.04) col = palettePick(rng, HI_PAL, rng());
          if (rng() < 0.02 && u[k] < 0.55) col = palettePick(rng, GOLD_PAL, rng());
          h.th.push(th); h.aj.push(aj); h.pj.push(pj); h.wj.push(wj);
          h.u.push(u[k]); h.v.push(v[k]);
          h.ac.push(Ly.ac); h.ao.push(Ly.ao);
          h.kc.push(Ly.kc); h.ko.push(Ly.ko);
          h.L.push(Ly.L * lj); h.wc.push(Ly.wc); h.wo.push(Ly.wo);
          h.live.push(col);
          h.wilt.push(palettePick(rng, WILT_PAL, 0.4*u[k] + 0.6*rng(), 0.7));
          h.rn.push(rng());
          h.rad.push(rngChoice(rng, [1.0, 1.5, 2.0], [0.3, 0.45, 0.25]));
          h.sp.push(profile(u[k]));
        }
      }
    }
    this.head = h;
  }

  buildStamens() {
    const {rng, Lf} = this;
    const n = 500, nf = 60;
    this.st = {th:[], beta:[], ell:[], t:[], live:[], wilt:[], rad:[]};
    for (let i = 0; i < n; i++) {
      const fid = Math.floor(rng() * nf);
      const t = 1 - Math.pow(rng(), 1.6);
      const live = palettePick(rng, STAMEN_PAL, t, 0.35);
      const wilt = palettePick(rng, STAMEN_WILT, rng(), 0.6);
      const rad = t > 0.88 ? 2.0 : rngChoice(rng, [1.0, 1.5], [0.5, 0.5]);
      this.st.th.push(rng() * 2 * Math.PI);
      this.st.beta.push(0.2 + rng() * 0.65);
      this.st.ell.push(0.30 + rng() * 0.25);
      this.st.t.push(t);
      this.st.live.push(live);
      this.st.wilt.push(wilt);
      this.st.rad.push(rad);
    }
  }

  buildLeaves() {
    const {rng} = this;
    const l = {lid:[], u:[], v:[], live:[], wilt:[], rn:[], rad:[]};
    const d = 600;
    for (let j = 0; j < LEAF_DEFS.length; j++) {
      const u = areaU(rng, d);
      const v = sampleV(rng, d, 0.10);
      for (let k = 0; k < d; k++) {
        let live;
        if (rng() < 0.09) {
          live = palettePick(rng, RIB_PAL, rng());
          v[k] = rngNormal(rng) * 0.03;
        } else {
          live = palettePick(rng, LEAF_PAL, u[k] + rngNormal(rng)*0.1);
        }
        l.lid.push(j);
        l.u.push(u[k]); l.v.push(v[k]);
        l.live.push(live);
        l.wilt.push(palettePick(rng, LEAF_WILT, rng(), 0.8));
        l.rn.push(rng());
        l.rad.push(rngChoice(rng, [1.0, 1.5, 2.0], [0.35, 0.45, 0.2]));
      }
    }
    this.leaf = l;
  }

  buildFx() {
    const {rng} = this;
    const n = 900;
    this.halo = {a:[], r:[], b:[], fl:[]};
    for (let i = 0; i < n; i++) {
      const r = Math.min(Math.abs(rngNormal(rng)*0.55), 1.6);
      this.halo.a.push(rng() * 2 * Math.PI);
      this.halo.r.push(r);
      this.halo.b.push(Math.pow(1 - r/1.6, 1.5) * 0.55);
      this.halo.fl.push(rng());
    }
    const cf=[], cj=[], rho=[], a=[], fl=[];
    for (let j = 0; j < 7; j++) {
      const m = j === 0 ? 400 : 100;
      for (let i = 0; i < m; i++) {
        cf.push(j === 0 ? 0.0 : 0.5);
        cj.push(Math.max(j-1, 0));
        rho.push(j === 0 ? 1.0 : 0.5);
        a.push(rng() * 2 * Math.PI);
        fl.push(rng());
      }
    }
    this.ring = {cf, cj, rho, a, fl};
    const ms = 180;
    this.spark = {a:[], rho:[], ph:[], sp:[], rad:[], hue:[]};
    for (let i = 0; i < ms; i++) {
      this.spark.a.push(rng() * 2 * Math.PI);
      this.spark.rho.push(rng());
      this.spark.ph.push(rng());
      this.spark.sp.push(0.6 + rng() * 0.8);
      this.spark.rad.push(rngChoice(rng, [1.0, 2.0], [0.7, 0.3]));
      this.spark.hue.push(rng());
    }
    const mf = 180;
    this.fall = {r0:[], ox:[], oy:[], xl:[], yl:[], ph:[], col:[], rad:[]};
    for (let i = 0; i < mf; i++) {
      const xl = this.cx + rngNormal(rng) * 0.12 * this.H;
      this.fall.r0.push(rng());
      this.fall.ox.push(rngNormal(rng));
      this.fall.oy.push(rngNormal(rng));
      this.fall.xl.push(xl);
      this.fall.yl.push(this.surface(xl) - rng() * 0.012 * this.H);
      this.fall.ph.push(rng() * 6.28);
      this.fall.col.push(palettePick(rng, WILT_PAL, rng(), 0.8));
      this.fall.rad.push(rngChoice(rng, [1.5, 2.0], [0.5, 0.5]));
    }
  }

  // ============ SOL (mesma estrutura da flor: camadas concêntricas de pixels) ============
  buildSun() {
    const rng = this.rng;
    // Camadas concêntricas como a flor
    const sunLayers = [
      {rMax: 0.25, d: 600, pal: SUN_CORE_PAL, spread: 0.3},  // núcleo
      {rMax: 0.55, d: 1400, pal: SUN_MID_PAL, spread: 0.5},  // meio
      {rMax: 0.85, d: 1800, pal: SUN_EDGE_PAL, spread: 0.6}, // borda
      {rMax: 1.10, d: 900, pal: SUN_RAY_PAL, spread: 0.7},   // raios externos
    ];

    const pixels = [];
    for (const Ly of sunLayers) {
      for (let i = 0; i < Ly.d; i++) {
        // Distribuição radial: mais denso no centro
        const r = Math.pow(rng(), 0.7) * Ly.rMax;
        const angle = rng() * 2 * Math.PI;
        // Jitter angular para não ficar perfeito
        const aj = rngNormal(rng) * 0.05;
        const px = r * Math.cos(angle + aj);
        const py = r * Math.sin(angle + aj);
        // Cor baseada no raio normalizado
        const g = r / Ly.rMax;
        const col = palettePick(rng, Ly.pal, g, Ly.spread);
        // Brilho: mais brilhante no centro
        const brightness = 0.7 + 0.3 * (1 - g);
        const rad = rngChoice(rng, [1.0, 1.5, 2.0], [0.35, 0.45, 0.2]);
        const phase = rng() * 2 * Math.PI; // para animação de brilho
        pixels.push({px, py, col, rad, phase, r});
      }
    }

    // Pontos de destaque (como os "hi" da flor)
    const nHi = 200;
    for (let i = 0; i < nHi; i++) {
      const r = Math.pow(rng(), 0.6) * 0.7;
      const angle = rng() * 2 * Math.PI;
      const px = r * Math.cos(angle);
      const py = r * Math.sin(angle);
      const col = palettePick(rng, SUN_HI_PAL, rng(), 0.3);
      const rad = rngChoice(rng, [1.5, 2.0], [0.5, 0.5]);
      const phase = rng() * 2 * Math.PI;
      pixels.push({px, py, col, rad, phase, r, isHi: true});
    }

    // Halo externo (partículas bem esparsas ao redor)
    const nHalo = 400;
    for (let i = 0; i < nHalo; i++) {
      const r = 0.9 + rng() * 0.5;
      const angle = rng() * 2 * Math.PI;
      const px = r * Math.cos(angle);
      const py = r * Math.sin(angle);
      const col = [255, 200, 100].map(c => c * (0.3 + rng()*0.4));
      const rad = 1.0;
      const phase = rng() * 2 * Math.PI;
      pixels.push({px, py, col, rad, phase, r, isHalo: true});
    }

    this.sun = {pixels};
  }

  buildStars() {
    const rng = this.rng;
    const n = 280;
    this.stars = [];
    for (let i = 0; i < n; i++) {
      this.stars.push({
        x: rng() * this.W,
        y: rng() * this.H * 0.85,
        phase: rng() * 2 * Math.PI,
        speed: 0.8 + rng() * 2.5,
        size: rng() < 0.2 ? 2 : 1,
        brightness: 0.4 + rng() * 0.6,
        rotation: rng() * Math.PI * 2
      });
    }
  }

  ctrl(L, wilt, sway) {
    const cx = this.cx, y0 = this.y0;
    const P0 = [cx, y0 + 4.0];
    const P1 = [cx - 0.06*L*(1-wilt) + 0.02*L*wilt, y0 - 0.33*L];
    const P2 = [cx + 0.05*L*(1-wilt) + 0.08*L*wilt + sway*0.5, y0 - L*(0.74 + 0.30*wilt)];
    const P3 = [cx + sway + 0.32*L*wilt, y0 - L*(1 - 0.15*wilt)];
    return [P0, P1, P2, P3];
  }

  render(t) {
    const {W, H} = this;
    const [stem, size, bloom, wilt, leaf, glow] = state(t);

    // Fundo preto
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // ============ ESTRELAS (fundo do céu) ============
    this.renderStars(t);

    // ============ SOL (por trás de tudo, subindo lentamente) ============
    // O sol sobe com a mesma "lentidão" que a flor cresceu (~30s para aparecer)
    // Começa a aparecer depois do pico da flor (t > 24)
    const sunAppearStart = 24.0;
    const sunAppearEnd = T_END;
    const sunProgress = Math.max(0, Math.min(1, (t - sunAppearStart) / (sunAppearEnd - sunAppearStart)));
    this.renderSun(t, sunProgress);

    // ============ SOLO ============
    ctx.drawImage(this.soilCanvas, 0, 0);
    const C = this.cr;
    for (let i = 0; i < C.x.length; i++) {
      const e = Math.max(0, Math.min(1, (t - C.delay[i]) / 3.0));
      const sy = C.y[i] - C.amp[i] * Math.sin(Math.PI * e);
      const [r, g, b] = C.col[i];
      ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
      ctx.fillRect(C.x[i]|0, sy|0, Math.ceil(C.rad[i]), Math.ceil(C.rad[i]));
    }

    // ============ FLOR (encolhendo) ============
    const batch = [];
    const Lf = this.Lf;
    const flowerScale = size; // encolhe com o tempo
    const L = this.Ls * stem * flowerScale;
    const sway = 0.012 * H * Math.sin(t * 0.9) * stem * (1 - 0.6 * wilt) * flowerScale;
    const P = this.ctrl(L, wilt, sway);
    const hx = P[3][0], hy = P[3][1];

    // Caule
    if (stem > 0.01 && flowerScale > 0.05) {
      const S = this.stem;
      const nv = Math.floor(S.s.length * Math.max(0.08, Math.min(1, stem)));
      for (let i = 0; i < nv; i++) {
        const s = S.s[i];
        const [x, y, dx, dy] = bez(P, s);
        const nn = Math.hypot(dx, dy) + 1e-6;
        const wst = 0.0085 * H * (1 - 0.3*s) * (1 - 0.25*wilt) * Math.max(0.4, Math.min(1, 0.4 + stem*1.2)) * flowerScale;
        const lat = S.lat[i] * wst;
        const wi = Math.max(0, Math.min(1, wilt * (0.75 + 0.5*s) * (0.7 + 0.5*S.rn[i])));
        const col = mixcol(S.live[i], S.wilt[i], wi);
        batch.push({x: x - dy/nn*lat, y: y + dx/nn*lat, col, rad: S.rad[i] * flowerScale, z: -500});
      }
    }

    // Folhas
    if (leaf > 0.02 && stem > 0.05 && flowerScale > 0.1) {
      const S = this.leaf;
      const nv = Math.floor(S.u.length * Math.max(0.15, Math.min(1, leaf)));
      const sa = LEAF_DEFS.map(d => d[0]);
      const mArr = LEAF_DEFS.map(d => d[1]);
      const lfac = LEAF_DEFS.map(d => d[2]);
      const a0Arr = LEAF_DEFS.map(d => d[3]);
      const cArr = LEAF_DEFS.map(d => d[4]);

      for (let i = 0; i < nv; i++) {
        const lid = S.lid[i];
        const [ax, ay] = bez(P, sa[lid]);
        const m = mArr[lid];
        const lf = lfac[lid];
        const a0 = a0Arr[lid] + (1-leaf)*0.8 - 0.6*wilt;
        const c = cArr[lid] - 0.5*wilt;
        const u = S.u[i], v = S.v[i];
        const LL = 0.19 * H * lf * leaf * (1 - 0.25*wilt) * flowerScale;
        const am = a0 + c*u*0.5;
        const al = a0 + c*u;
        const sc = sinc(c*u*0.5);
        const lat = v * 0.27 * LL * profile(u);
        const X = ax + LL*u*m*Math.cos(am)*sc - lat*Math.sin(al);
        const Yup = LL*u*Math.sin(am)*sc + lat*m*Math.cos(al);
        const wi = Math.max(0, Math.min(1, wilt*(0.9 + 0.5*u + 0.3*S.rn[i]) - 0.1));
        const col = mixcol(S.live[i], S.wilt[i], wi);
        batch.push({x: X, y: ay - Yup, col, rad: S.rad[i] * flowerScale, z: -450});
      }
    }

    // Cabeça da flor
    if (stem > 0.01 && size > 0.05 && flowerScale > 0.1) {
      const phi = wilt * 2.75 + 0.035 * Math.sin(t*0.9 + 1.0) * (1-wilt);
      const tau = 0.20 + 0.36*bloom - 0.40*wilt;
      const cphi = Math.cos(phi), sphi = Math.sin(phi);
      const ct = Math.cos(tau), st_ = Math.sin(tau);
      const Ls_ = Lf * size * flowerScale;

      const project = (xl, yl, zl) => {
        const yp = yl*ct - zl*st_;
        const zp = yl*st_ + zl*ct;
        return [hx + xl*cphi + yp*sphi, hy - (-xl*sphi + yp*cphi), zp, yp];
      };

      const vis = Math.max(0.2, Math.min(1, size*size*1.15));
      const h = this.head;
      const nv = Math.floor(h.u.length * vis);

      for (let i = 0; i < nv; i++) {
        const u = h.u[i], v = h.v[i];
        const A0 = (h.ac[i] + (h.ao[i]-h.ac[i])*bloom + h.aj[i]) * (1 - 0.55*wilt) + wilt*h.wj[i]*0.3;
        const K = h.kc[i] + (h.ko[i]-h.kc[i])*bloom + wilt*(0.6 + 0.6*h.pj[i]);
        const Lp = Ls_ * h.L[i] * (1 - 0.28*wilt*h.pj[i]);
        const am = A0 + K*u*0.5;
        const sc = sinc(K*u*0.5);
        let rr = Lp*u*Math.sin(am)*sc;
        const hh = Lp*u*Math.cos(am)*sc;
        const lat = v * (h.wc[i] + (h.wo[i]-h.wc[i])*bloom) * Lp * h.sp[i];
        rr = rr + 0.025*Ls_ - 0.5*lat*lat/(Lp+1);
        const cth = Math.cos(h.th[i]), sth = Math.sin(h.th[i]);
        const [X, Y, zp] = project(cth*rr - sth*lat, hh, sth*rr + cth*lat);
        const shade = Math.max(0.5, Math.min(1.2, 0.72 + 0.28*Math.max(0, Math.min(1, zp/Ls_*0.5+0.5)) + 0.12*(hh/Ls_)));
        const wi = Math.max(0, Math.min(1, wilt*(1.0 + 0.7*u + 0.4*h.rn[i]) - 0.2));
        const col = mixcol(h.live[i], h.wilt[i], wi).map(c => c*shade);
        batch.push({x: X, y: Y, col, rad: h.rad[i] * flowerScale, z: zp});
      }

      // Estames
      const ss = smoothstep(bloom, 0.30, 0.85);
      if (ss > 0.02) {
        const S = this.st;
        const nv2 = Math.floor(S.t.length * Math.max(0.25, Math.min(1, size*size)));
        for (let i = 0; i < nv2; i++) {
          const ell = Ls_ * ss * S.ell[i];
          const beta = S.beta[i] * (0.6 + 0.4*bloom) + wilt*0.3;
          const r = ell * S.t[i] * Math.sin(beta) + 0.02*Ls_;
          const yl = 0.05*Ls_ + ell*S.t[i]*Math.cos(beta);
          const [X, Y, zp] = project(Math.cos(S.th[i])*r, yl, Math.sin(S.th[i])*r);
          const col = mixcol(S.live[i], S.wilt[i], wilt);
          batch.push({x: X, y: Y, col, rad: S.rad[i] * flowerScale, z: zp + 3});
        }
      }

      // Glow / halo da flor
      if (glow > 0.02) {
        const axis = [Math.sin(phi), -Math.cos(phi)];
        const ccx = hx + axis[0]*0.5*Ls_;
        const ccy = hy + axis[1]*0.5*Ls_;

        const Hh = this.halo;
        const nh = Math.floor(Hh.a.length * glow);
        for (let i = 0; i < nh; i++) {
          const rh = Hh.r[i] * Ls_ * 1.1;
          const br = Hh.b[i] * glow * (0.85 + 0.3*Math.sin(t*1.3 + Hh.fl[i]*6.28));
          batch.push({
            x: ccx + Math.cos(Hh.a[i])*rh,
            y: ccy + Math.sin(Hh.a[i])*rh,
            col: [150*br, 70*br, 240*br],
            rad: 1, z: -2000
          });
        }

        const R = this.ring;
        const nr = Math.floor(R.a.length * glow);
        const Rs = Ls_ * 1.25;
        for (let i = 0; i < nr; i++) {
          const cang = 2*Math.PI*R.cj[i]/6 + t*0.15;
          const a = R.a[i] + t*0.05;
          const rx = ccx + Rs*(R.cf[i]*Math.cos(cang) + R.rho[i]*Math.cos(a));
          const ry = ccy + Rs*(R.cf[i]*Math.sin(cang) + R.rho[i]*Math.sin(a));
          const bb = (0.40 + 0.60*glow) * (0.65 + 0.35*Math.sin(t*2 + R.fl[i]*20));
          batch.push({x: rx, y: ry, col: [210*bb, 145*bb, 255*bb], rad: 1, z: -1500});
        }

        const Sp = this.spark;
        for (let i = 0; i < Sp.a.length; i++) {
          const life = (t*0.10*Sp.sp[i] + Sp.ph[i]) % 1.0;
          const rho = (0.25 + 1.15*Sp.rho[i]) * Ls_ * (0.6 + 0.6*life);
          const px = ccx + Math.cos(Sp.a[i])*rho;
          const py = ccy + Math.sin(Sp.a[i])*rho - life*0.25*Ls_;
          const bs = Math.pow(Math.sin(Math.PI*life), 0.8) * glow;
          const cs = Sp.hue[i] < 0.5 ? [255,215,255] : [255,150,235];
          batch.push({x: px, y: py, col: cs.map(c => c*bs), rad: Sp.rad[i], z: 2000});
        }
      }

      // Pétalas caindo
      if (wilt > 0.02) {
        const F = this.fall;
        for (let i = 0; i < F.r0.length; i++) {
          const fp = Math.max(0, Math.min(1, (wilt*1.05 - F.r0[i]*0.7) / 0.35));
          if (fp > 0) {
            const sx = hx + F.ox[i]*0.18*Ls_;
            const sy = hy + F.oy[i]*0.18*Ls_ + 0.25*Ls_;
            const x = sx + (F.xl[i]-sx)*fp + Math.sin(fp*6.28 + F.ph[i])*0.03*H*(1-fp);
            const y = sy + (F.yl[i]-sy)*fp*fp;
            batch.push({x, y, col: F.col[i], rad: F.rad[i], z: 500});
          }
        }
      }
    }

    // Ordenar e desenhar batch da flor
    batch.sort((a, b) => a.z - b.z);
    for (const p of batch) {
      const [r, g, b] = p.col;
      ctx.fillStyle = `rgb(${Math.max(0,Math.min(255,r|0))},${Math.max(0,Math.min(255,g|0))},${Math.max(0,Math.min(255,b|0))})`;
      const sz = Math.max(1, Math.ceil(p.rad));
      ctx.fillRect(p.x|0, p.y|0, sz, sz);
    }
  }

  // Desenha uma estrelinha de 5 pontas (formato infantil)
  drawStar(cx, cy, size, rotation, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const x = Math.cos(angle) * size;
      const y = Math.sin(angle) * size;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  renderStars(t) {
    for (const s of this.stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
      const alpha = s.brightness * twinkle;
      if (alpha < 0.15) continue;
      const brightness = 220 + 35 * twinkle;
      const color = `rgb(${brightness|0},${brightness|0},${(brightness+15)|0})`;
      const sz = s.size * (0.8 + 0.2 * twinkle);
      // Rotação lenta
      const rot = s.rotation + t * 0.1;
      this.drawStar(s.x, s.y, sz, rot, color, alpha);
    }
  }

  renderSun(t, sunProgress) {
    if (sunProgress <= 0) return;

    const {W, H, sun} = this;

    // Posição: sobe de baixo (atrás da terra) até o céu
    const sunYStart = H * 1.15; // começa bem embaixo, atrás da terra
    const sunYEnd = H * 0.30;   // posição final no céu
    const sunY = sunYStart + (sunYEnd - sunYStart) * sunProgress;
    const sunX = W / 2;

    // Raio do sol: cresce junto com a subida
    const sunRadiusMax = H * 0.22;
    const sunRadius = sunRadiusMax * sunProgress;

    // Brilho global pulsante
    const globalPulse = 0.88 + 0.12 * Math.sin(t * 1.5);

    // Aura/brilho externo do sol (screen blend)
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const auraRadius = sunRadius * 2.5;
    const gradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, auraRadius);
    const auraAlpha = 0.25 * sunProgress * globalPulse;
    gradient.addColorStop(0, `rgba(255, 240, 180, ${auraAlpha})`);
    gradient.addColorStop(0.3, `rgba(255, 200, 100, ${auraAlpha * 0.6})`);
    gradient.addColorStop(0.7, `rgba(255, 160, 60, ${auraAlpha * 0.2})`);
    gradient.addColorStop(1, 'rgba(255, 140, 40, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(sunX - auraRadius, sunY - auraRadius, auraRadius*2, auraRadius*2);
    ctx.restore();

    // Desenha cada pixel do sol (mesma técnica da flor: pontos coloridos)
    for (const p of sun.pixels) {
      // Só renderiza se estiver dentro do raio atual de progresso
      if (p.r > sunProgress * 1.15) continue;

      const px = sunX + p.px * sunRadius;
      const py = sunY + p.py * sunRadius;

      // Brilho individual pulsante
      const twinkle = 0.7 + 0.3 * Math.sin(t * 2.0 + p.phase);
      const brightness = twinkle * globalPulse * sunProgress;

      // Atenuação para halo
      let alpha = 1.0;
      if (p.isHalo) {
        alpha = 0.4 + 0.3 * Math.sin(t * 1.8 + p.phase);
      }

      const [r, g, b] = p.col;
      const fr = Math.max(0, Math.min(255, r * brightness));
      const fg = Math.max(0, Math.min(255, g * brightness));
      const fb = Math.max(0, Math.min(255, b * brightness));

      ctx.fillStyle = `rgba(${fr|0},${fg|0},${fb|0},${alpha})`;
      const sz = Math.max(1, Math.ceil(p.rad * (0.8 + 0.2 * sunProgress)));
      ctx.fillRect(px|0, py|0, sz, sz);
    }
  }
}

// ============ APP ============
let plant = new Plant(W, H);
let clock = 0;
let lastTime = performance.now();
let paused = false;

const timeLabel = document.getElementById('time');
const playBtn = document.getElementById('play');
const restartBtn = document.getElementById('restart');

playBtn.onclick = () => {
  paused = !paused;
  playBtn.textContent = paused ? '▶ play' : '⏸ pausa';
};
restartBtn.onclick = () => { clock = 0; };

function loop() {
  const now = performance.now();
  if (!paused) clock += (now - lastTime) / 1000;
  lastTime = now;
  const t = clock / TIME_SCALE;

  plant.render(t);
  timeLabel.textContent = t.toFixed(1) + 's';

  requestAnimationFrame(loop);
}
loop();

window.addEventListener('resize', () => {
  resize();
  plant = new Plant(W, H);
});
</script>
</body>
